<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bester Minecraft Realms - Mobile App</title>
    <link rel="canonical" href="https://dampf.mypi.co/" />
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="Bester Minecraft Realms" />
    <meta name="description" content="Tritt unserer exklusiven Minecraft Community bei. Die besten deutschen Realms für Bedrock & Java. Erlebe tägliche PvP-Turniere, professionelle Survival-Realms, aktive Clan-Wars und eine wachsende Community. Jetzt beitreten und Realm-Codes sichern!" />
    <meta name="keywords" content="Minecraft, Minecraft Community, Minecraft Server, Minecraft Realm, PvP, Survival, Minecraft Deutschland, Minecraft Multiplayer, Bedrock Edition, Java Edition" />
    <meta name="google-site-verification" content="qgWPVa9f6NAdC33HjdoyCz7HzqZg37Xa-awVvMta6CY" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1042/1042738.png" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NSVNDGX1WL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NSVNDGX1WL');
    </script>

    <!-- Umami Analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="0d1ce77c-ff2b-45a2-8a4b-0aa2700fb841"></script>

    <style>
      /* Handy / Mobile App Optimizations */
      html, body {
        background-color: #020617; /* Dunkler Hintergrund */
        margin: 0;
        padding: 0;
        overscroll-behavior-y: none; /* Verhindert Pull-to-Refresh am Handy */
        -webkit-tap-highlight-color: transparent;
        width: 100%;
        height: 100%;
      }
      
      #root {
        width: 100%;
        height: 100vh;
        height: 100dvh; /* Nutzt dynamische Viewport-Höhe für Handys (Safari) */
        overflow-y: auto;
        overflow-x: hidden;
        background-color: #0f172a;
        /* Safe Areas für moderne Smartphones (Notch) */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        position: relative;
        margin: 0 auto;
      }
      
      /* Optional: Wenn es am PC geöffnet wird, zwinge es in ein Handy-Format */
      @media (min-width: 768px) {
        body {
          display: flex;
          align-items: center;
          justify-content: center;
          background: #000;
        }
        #root {
          max-width: 430px;
          height: 90vh;
          border-radius: 32px;
          border: 8px solid #1e293b;
          box-shadow: 0 0 40px rgba(0,0,0,0.8);
          overflow: hidden;
          position: relative;
        }
        /* Override Tailwind desktop grid classes within the forced mobile container to prevent layout breaking */
        #root .md\:grid-cols-2, #root .md\:grid-cols-3, #root .md\:grid-cols-4, #root .lg\:grid-cols-6 {
          grid-template-columns: 1fr !important;
        }
        #root .md\:flex-row {
          flex-direction: column !important;
        }
        #root .md\:w-64 {
          width: 100% !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Die App lädt direkt ohne Geräte-Auswahl! -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
